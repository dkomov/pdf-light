name: Bug report
description: Report a reproducible problem with PDF Light.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please share only public or synthetic examples. For vulnerabilities, see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App version, macOS version and Mac architecture
      placeholder: PDF Light 1.1.0, macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and settings
      description: Include mode, target size, repair setting and interface language.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Synthetic example or screenshots
      description: Remove private paths and document content. Do not attach confidential PDFs.
